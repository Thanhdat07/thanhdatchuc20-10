<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #060205;
      --bg-card: rgba(16, 4, 12, 0.84);
      --pink-main: #ff2a85;
      --pink-light: #ff7ab8;
      --pink-neon: #ff007f;
      --pink-soft: #ffc2df;
      --text-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-black);
      background-image:
        radial-gradient(circle at 50% 15%, rgba(255, 42, 133, 0.22) 0%, transparent 55%),
        radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 15% 80%, rgba(255, 122, 184, 0.1) 0%, transparent 45%);
      color: var(--text-white);
      font-family: 'Be Vietnam Pro', sans-serif;
      overflow-x: hidden;
    }

    /* Canvas hoa hồng rơi mượt 60FPS */
    #roseCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .app-wrapper {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 95px;
    }

    .screen {
      width: 100%;
      max-width: 700px;
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeScreen 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeScreen {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Khung thẻ chính */
    .glass-card {
      width: 100%;
      background: var(--bg-card);
      border: 1.5px solid rgba(255, 42, 133, 0.55);
      border-radius: 26px;
      padding: 34px 26px;
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.85),
        0 0 28px rgba(255, 42, 133, 0.28),
        inset 0 0 18px rgba(255, 42, 133, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .badge-2010 {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      border-radius: 999px;
      background: rgba(255, 42, 133, 0.2);
      border: 1px solid var(--pink-light);
      color: var(--text-white);
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
      box-shadow: 0 0 14px rgba(255, 42, 133, 0.45);
    }

    .intro-title {
      text-align: center;
      font-size: clamp(1.55rem, 4.5vw, 2.35rem);
      font-weight: 800;
      line-height: 1.35;
      color: var(--text-white);
      text-shadow:
        0 0 10px rgba(255, 42, 133, 0.9),
        0 0 24px rgba(255, 0, 127, 0.55);
      margin-bottom: 26px;
    }

    /* Form nhập tên & chọn mối quan hệ */
    .form-group {
      width: 100%;
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--pink-soft);
    }

    .input-name {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1.5px solid rgba(255, 122, 184, 0.55);
      background: rgba(8, 2, 6, 0.9);
      color: var(--text-white);
      font-size: 1.05rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .input-name::placeholder {
      color: rgba(255, 255, 255, 0.48);
    }

    .input-name:focus {
      border-color: var(--pink-main);
      box-shadow: 0 0 16px rgba(255, 42, 133, 0.5);
    }

    .relation-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .relation-option {
      position: relative;
      cursor: pointer;
    }

    .relation-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .relation-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px 10px;
      border-radius: 16px;
      background: rgba(15, 4, 11, 0.85);
      border: 1.5px solid rgba(255, 122, 184, 0.35);
      color: var(--text-white);
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.25s ease;
    }

    .relation-tile .icon {
      font-size: 1.5rem;
    }

    .relation-option input:checked + .relation-tile {
      background: linear-gradient(135deg, rgba(255, 42, 133, 0.42), rgba(255, 0, 127, 0.22));
      border-color: var(--text-white);
      box-shadow: 0 0 20px rgba(255, 42, 133, 0.65);
      transform: translateY(-2px);
    }

    .error-msg {
      color: #ff85b3;
      font-size: 0.9rem;
      text-align: center;
      min-height: 22px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .btn-start {
      width: 100%;
      padding: 15px 24px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      background: linear-gradient(90deg, #ff1f7a, #ff5ca8, #ff1f7a);
      background-size: 200% auto;
      color: var(--text-white);
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(255, 42, 133, 0.75);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: gradientPulse 3s linear infinite;
    }

    .btn-start:hover {
      transform: scale(1.02);
      box-shadow: 0 0 32px rgba(255, 42, 133, 0.95);
    }

    .btn-start:active {
      transform: scale(0.98);
    }

    @keyframes gradientPulse {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* TIÊU ĐỀ TỎA SÁNG MẮT CÁ (FISHEYE SHINE LOOP) */
    .fisheye-container {
      perspective: 700px;
      width: 100%;
      text-align: center;
      margin-bottom: 22px;
      padding: 12px 8px;
    }

    .fisheye-title {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 2px;
      font-size: clamp(1.35rem, 4.2vw, 2.25rem);
      font-weight: 800;
      line-height: 1.4;
      color: var(--text-white);
      transform-style: preserve-3d;
    }

    .fisheye-word {
      display: inline-flex;
      margin: 0 5px;
      transform-style: preserve-3d;
    }

    .fisheye-char {
      display: inline-block;
      color: var(--text-white);
      will-change: transform, text-shadow;
      animation: fisheyeLens 2.6s ease-in-out infinite;
      animation-delay: calc(var(--char-idx) * 0.07s);
    }

    @keyframes fisheyeLens {
      0%, 100% {
        transform: scale(0.92) translateZ(0px);
        text-shadow:
          0 0 6px rgba(255, 42, 133, 0.6),
          0 0 12px rgba(255, 0, 127, 0.35);
        color: #ffe6f2;
      }
      50% {
        transform: scale(1.34) translateY(-4px) translateZ(36px);
        text-shadow:
          0 0 10px #ffffff,
          0 0 22px #ff2a85,
          0 0 38px #ff007f,
          0 0 55px #ff7ab8;
        color: #ffffff;
      }
    }

    /* BẢNG LỜI CHÚC GÕ CHỮ */
    .wish-board {
      width: 100%;
      background: rgba(10, 2, 8, 0.88);
      border: 2px solid var(--pink-main);
      border-radius: 22px;
      padding: 22px 22px 18px;
      box-shadow:
        0 0 30px rgba(255, 42, 133, 0.35),
        inset 0 0 20px rgba(255, 42, 133, 0.14);
      position: relative;
    }

    .wish-board-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(255, 122, 184, 0.45);
      padding-bottom: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .wish-recipient-tag {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--pink-soft);
    }

    .btn-skip-typing {
      background: rgba(255, 42, 133, 0.22);
      border: 1px solid var(--pink-light);
      color: var(--text-white);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-skip-typing:hover {
      background: rgba(255, 42, 133, 0.5);
    }

    .wish-content {
      font-size: clamp(0.98rem, 2.5vw, 1.1rem);
      line-height: 1.75;
      color: var(--text-white);
      white-space: pre-line;
      min-height: 150px;
      max-height: 360px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .wish-content::-webkit-scrollbar {
      width: 6px;
    }
