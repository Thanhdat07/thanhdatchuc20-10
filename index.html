<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #060205;
      --bg-card: rgba(16, 4, 12, 0.84);
      --pink-main: #ff2a85;
      --pink-light: #ff7ab8;
      --pink-neon: #ff007f;
      --pink-soft: #ffc2df;
      --text-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-black);
      background-image:
        radial-gradient(circle at 50% 15%, rgba(255, 42, 133, 0.22) 0%, transparent 55%),
        radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 15% 80%, rgba(255, 122, 184, 0.1) 0%, transparent 45%);
      color: var(--text-white);
      font-family: 'Be Vietnam Pro', sans-serif;
      overflow-x: hidden;
    }

    /* Canvas hoa hồng rơi mượt 60FPS */
    #roseCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .app-wrapper {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 95px;
    }

    .screen {
      width: 100%;
      max-width: 700px;
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeScreen 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeScreen {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Khung thẻ chính */
    .glass-card {
      width: 100%;
      background: var(--bg-card);
      border: 1.5px solid rgba(255, 42, 133, 0.55);
      border-radius: 26px;
      padding: 34px 26px;
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.85),
        0 0 28px rgba(255, 42, 133, 0.28),
        inset 0 0 18px rgba(255, 42, 133, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .badge-2010 {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      border-radius: 999px;
      background: rgba(255, 42, 133, 0.2);
      border: 1px solid var(--pink-light);
      color: var(--text-white);
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
      box-shadow: 0 0 14px rgba(255, 42, 133, 0.45);
    }

    .intro-title {
      text-align: center;
      font-size: clamp(1.55rem, 4.5vw, 2.35rem);
      font-weight: 800;
      line-height: 1.35;
      color: var(--text-white);
      text-shadow:
        0 0 10px rgba(255, 42, 133, 0.9),
        0 0 24px rgba(255, 0, 127, 0.55);
      margin-bottom: 26px;
    }

    /* Form nhập tên & chọn mối quan hệ */
    .form-group {
      width: 100%;
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--pink-soft);
    }

    .input-name {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1.5px solid rgba(255, 122, 184, 0.55);
      background: rgba(8, 2, 6, 0.9);
      color: var(--text-white);
      font-size: 1.05rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .input-name::placeholder {
      color: rgba(255, 255, 255, 0.48);
    }

    .input-name:focus {
      border-color: var(--pink-main);
      box-shadow: 0 0 16px rgba(255, 42, 133, 0.5);
    }

    .relation-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .relation-option {
      position: relative;
      cursor: pointer;
    }

    .relation-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .relation-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px 10px;
      border-radius: 16px;
      background: rgba(15, 4, 11, 0.85);
      border: 1.5px solid rgba(255, 122, 184, 0.35);
      color: var(--text-white);
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.25s ease;
    }

    .relation-tile .icon {
      font-size: 1.5rem;
    }

    .relation-option input:checked + .relation-tile {
      background: linear-gradient(135deg, rgba(255, 42, 133, 0.42), rgba(255, 0, 127, 0.22));
      border-color: var(--text-white);
      box-shadow: 0 0 20px rgba(255, 42, 133, 0.65);
      transform: translateY(-2px);
    }

    .error-msg {
      color: #ff85b3;
      font-size: 0.9rem;
      text-align: center;
      min-height: 22px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .btn-start {
      width: 100%;
      padding: 15px 24px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      background: linear-gradient(90deg, #ff1f7a, #ff5ca8, #ff1f7a);
      background-size: 200% auto;
      color: var(--text-white);
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(255, 42, 133, 0.75);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: gradientPulse 3s linear infinite;
    }

    .btn-start:hover {
      transform: scale(1.02);
      box-shadow: 0 0 32px rgba(255, 42, 133, 0.95);
    }

    .btn-start:active {
      transform: scale(0.98);
    }

    @keyframes gradientPulse {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* TIÊU ĐỀ TỎA SÁNG MẮT CÁ (FISHEYE SHINE LOOP) */
    .fisheye-container {
      perspective: 700px;
      width: 100%;
      text-align: center;
      margin-bottom: 22px;
      padding: 12px 8px;
    }

    .fisheye-title {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 2px;
      font-size: clamp(1.35rem, 4.2vw, 2.25rem);
      font-weight: 800;
      line-height: 1.4;
      color: var(--text-white);
      transform-style: preserve-3d;
    }

    .fisheye-word {
      display: inline-flex;
      margin: 0 5px;
      transform-style: preserve-3d;
    }

    .fisheye-char {
      display: inline-block;
      color: var(--text-white);
      will-change: transform, text-shadow;
      animation: fisheyeLens 2.6s ease-in-out infinite;
      animation-delay: calc(var(--char-idx) * 0.07s);
    }

    @keyframes fisheyeLens {
      0%, 100% {
        transform: scale(0.92) translateZ(0px);
        text-shadow:
          0 0 6px rgba(255, 42, 133, 0.6),
          0 0 12px rgba(255, 0, 127, 0.35);
        color: #ffe6f2;
      }
      50% {
        transform: scale(1.34) translateY(-4px) translateZ(36px);
        text-shadow:
          0 0 10px #ffffff,
          0 0 22px #ff2a85,
          0 0 38px #ff007f,
          0 0 55px #ff7ab8;
        color: #ffffff;
      }
    }

    /* BẢNG LỜI CHÚC GÕ CHỮ */
    .wish-board {
      width: 100%;
      background: rgba(10, 2, 8, 0.88);
      border: 2px solid var(--pink-main);
      border-radius: 22px;
      padding: 22px 22px 18px;
      box-shadow:
        0 0 30px rgba(255, 42, 133, 0.35),
        inset 0 0 20px rgba(255, 42, 133, 0.14);
      position: relative;
    }

    .wish-board-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(255, 122, 184, 0.45);
      padding-bottom: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .wish-recipient-tag {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--pink-soft);
    }

    .btn-skip-typing {
      background: rgba(255, 42, 133, 0.22);
      border: 1px solid var(--pink-light);
      color: var(--text-white);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-skip-typing:hover {
      background: rgba(255, 42, 133, 0.5);
    }

    .wish-content {
      font-size: clamp(0.98rem, 2.5vw, 1.1rem);
      line-height: 1.75;
      color: var(--text-white);
      white-space: pre-line;
      min-height: 150px;
      max-height: 360px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .wish-content::-webkit-scrollbar {
      width: 6px;
    }

    .wish-content::-webkit-scrollbar-thumb {
      background: var(--pink-main);
      border-radius: 999px;
    }

    .typing-cursor {
      display: inline-block;
      width: 9px;
      height: 1.15em;
      background: var(--pink-light);
      vertical-align: text-bottom;
      margin-left: 4px;
      box-shadow: 0 0 8px var(--pink-main);
      animation: blinkCursor 0.75s step-end infinite;
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* DÒNG CHỮ SÓNG LẶP: "Thành Đạt gửi lời chúc nha !" */
    .signature-box {
      margin-top: 24px;
      text-align: center;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255, 42, 133, 0.14);
      border: 1px solid rgba(255, 122, 184, 0.45);
      box-shadow: 0 0 18px rgba(255, 42, 133, 0.3);
    }

    .wave-text {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      font-size: clamp(1.05rem, 3vw, 1.3rem);
      font-weight: 800;
      color: var(--text-white);
      letter-spacing: 0.5px;
    }

    .wave-char {
      display: inline-block;
      will-change: transform;
      animation: waveLoop 1.6s ease-in-out infinite;
      animation-delay: calc(var(--w-idx) * 0.06s);
      text-shadow:
        0 0 8px #ff2a85,
        0 0 16px #ff007f;
    }

    @keyframes waveLoop {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
        color: #ffffff;
      }
      50% {
        transform: translateY(-9px) rotate(-2deg) scale(1.08);
        color: #ff99cc;
      }
    }

    .action-row {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-secondary {
      background: rgba(20, 5, 15, 0.85);
      border: 1.5px solid var(--pink-light);
      color: var(--text-white);
      padding: 9px 18px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: var(--pink-main);
      box-shadow: 0 0 15px rgba(255, 42, 133, 0.65);
    }

    /* Thanh điều khiển nhạc YouTube 120s ở đáy trang */
    .music-bar {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: calc(100% - 28px);
      max-width: 560px;
      background: rgba(12, 3, 9, 0.92);
      border: 1.5px solid var(--pink-main);
      border-radius: 999px;
      padding: 9px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.85), 0 0 20px rgba(255, 42, 133, 0.45);
      backdrop-filter: blur(10px);
    }

    .music-bar.show {
      display: flex;
    }

    .music-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      flex: 1;
    }

    .music-disc {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff7ab8 20%, #ff007f 60%, #1a0310 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
      animation: spinDisc 4s linear infinite;
      box-shadow: 0 0 10px var(--pink-main);
    }

    .music-disc.paused {
      animation-play-state: paused;
    }

    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .music-text-wrap {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .music-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-white);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-timer {
      font-size: 0.75rem;
      color: var(--pink-soft);
    }

    .music-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-music {
      background: var(--pink-main);
      border: 1px solid var(--text-white);
      color: var(--text-white);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Khung YouTube ẩn hỗ trợ phát tự động */
    #ytHiddenWrap {
      position: fixed;
      bottom: 72px;
      right: 16px;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0.01;
      pointer-events: none;
      z-index: 5;
      transition: all 0.3s ease;
    }

    #ytHiddenWrap.visible-player {
      width: 240px;
      height: 135px;
      opacity: 1;
      pointer-events: auto;
      border-radius: 14px;
      border: 2px solid var(--pink-main);
      box-shadow: 0 0 20px rgba(255, 42, 133, 0.7);
      background: #000;
    }
  </style>
</head>
<body>

  <!-- Background Hoa Hồng Rơi 60FPS -->
  <canvas id="roseCanvas"></canvas>

  <main class="app-wrapper">
    <!-- MÀN HÌNH 1: NHẬP TÊN & CHỌN MỐI QUAN HỆ -->
    <section id="screenIntro" class="screen active">
      <div class="glass-card" style="text-align: center;">
        <div class="badge-2010">🌹 Happy Vietnamese Women's Day 🌹</div>
        <h1 class="intro-title">Chúc Mừng ngày phụ nữ Việt Nam 20/10</h1>

        <div class="form-group" style="text-align: left;">
          <label class="form-label" for="recipientName">Nhập tên người nhận lời chúc:</label>
          <input
            type="text"
            id="recipientName"
            class="input-name"
            placeholder="Ví dụ: Linh, Mẹ Yêu, Chị Hoa..."
            autocomplete="off"
          />
        </div>

        <div class="form-group" style="text-align: left;">
          <label class="form-label">Chọn mối quan hệ:</label>
          <div class="relation-grid">
            <label class="relation-option">
              <input type="radio" name="relationship" value="ban" checked />
              <div class="relation-tile">
                <span class="icon">✨</span>
                <span>Bạn</span>
              </div>
            </label>
            <label class="relation-option">
              <input type="radio" name="relationship" value="me" />
              <div class="relation-tile">
                <span class="icon">💖</span>
                <span>Mẹ</span>
              </div>
            </label>
            <label class="relation-option">
              <input type="radio" name="relationship" value="chi" />
              <div class="relation-tile">
                <span class="icon">🌸</span>
                <span>Chị</span>
              </div>
            </label>
          </div>
        </div>

        <div id="errorText" class="error-msg"></div>

        <button id="btnStart" class="btn-start" type="button">
          Bắt đầu
        </button>
      </div>
    </section>

    <!-- MÀN HÌNH 2: HIỂN THỊ LỜI CHÚC & PHÁT NHẠC -->
    <section id="screenWish" class="screen">
      <!-- Tiêu đề hiệu ứng vòng lặp tỏa sáng mắt cá -->
      <div class="fisheye-container">
        <h2 id="fisheyeHeading" class="fisheye-title"></h2>
      </div>

      <!-- Bảng lời chúc hiệu ứng gõ chữ -->
      <div class="wish-board">
        <div class="wish-board-header">
          <span id="recipientBadge" class="wish-recipient-tag">🌹 Gửi lời chúc 20/10</span>
          <button id="btnSkipTyping" class="btn-skip-typing" type="button">Hiện nhanh ⚡</button>
        </div>
        <div class="wish-content">
          <span id="typewriterText"></span><span id="typingCursor" class="typing-cursor"></span>
        </div>
      </div>

      <!-- Chữ ký hiệu ứng vòng lặp sóng lặp -->
      <div class="signature-box">
        <div id="waveSignature" class="wave-text"></div>
      </div>

      <div class="action-row">
        <button id="btnBack" class="btn-secondary" type="button">⬅ Nhập tên khác</button>
        <button id="btnToggleVideo" class="btn-secondary" type="button">🎬 Hiện/Ẩn khung YouTube</button>
      </div>
    </section>
  </main>

  <!-- Khung chứa YouTube IFrame -->
  <div id="ytHiddenWrap">
    <div id="ytPlayerContainer"></div>
  </div>

  <!-- Thanh trạng thái nhạc 120 giây -->
  <div id="musicBar" class="music-bar">
    <div class="music-info">
      <div id="musicDisc" class="music-disc">🎵</div>
      <div class="music-text-wrap">
        <div id="musicTitle" class="music-title">Đang kết nối nhạc...</div>
        <div id="musicTimer" class="music-timer">Đoạn nhạc 120s: 00:00 / 02:00</div>
      </div>
    </div>
    <div class="music-controls">
      <button id="btnPlayPause" class="btn-music" type="button">Tạm dừng</button>
    </div>
  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    /**************************************************************
     * 1. DỮ LIỆU LỜI CHÚC & 3 LINK YOUTUBE CỦA BẠN
     **************************************************************/
    const MAX_DURATION_SECONDS = 120; // Phát 120 giây (2 phút)

    const WISH_CONFIG = {
      ban: {
        label: "Bạn",
        youtubeId: "5h46b1Lm8DU", // Link bài hát dành cho Bạn
        songName: "Một Ngày Buồn - Kiều Chi",
        message: `Chúc mừng 20/10! Chúc bạn luôn rạng rỡ, tự tin và gặp thật nhiều điều tốt đẹp.
Gửi đến bạn lời chúc 20/10 chân thành nhất: luôn an nhiên, may mắn và được sống với điều mình yêu.`
      },
      me: {
        label: "Mẹ",
        youtubeId: "aTKQHlIG-BM", // Link bài hát dành cho Mẹ
        songName: "Ấn Nút Nhớ Thả Giấc Mơ - Sơn Tùng M-TP",
        message: `Nhân ngày 20/10, con chúc mẹ luôn mạnh khỏe, bình an và hạnh phúc. Cảm ơn mẹ vì đã luôn yêu thương, chăm sóc và dành những điều tốt đẹp nhất cho gia đình. Con yêu mẹ rất nhiều!`
      },
      chi: {
        label: "Chị",
        youtubeId: "rYc1UbgbMIY", // Link bài hát dành cho Chị
        songName: "Em Xinh - MONO",
        message: `Chúc chị luôn xinh đẹp, khỏe mạnh, vui vẻ và gặp nhiều may mắn. Mong mọi dự định đều thuận lợi và mỗi ngày đều có thêm lý do để mỉm cười.`
      }
    };

    /**************************************************************
     * 2. HIỆU ỨNG SÓNG LẶP CHO "Thành Đạt gửi lời chúc nha !"
     **************************************************************/
    function initWaveSignature() {
      const text = "Thành Đạt gửi lời chúc nha !";
      const container = document.getElementById("waveSignature");
      container.innerHTML = "";
      [...text].forEach((ch, idx) => {
        const span = document.createElement("span");
        span.className = "wave-char";
        span.style.setProperty("--w-idx", idx);
        span.textContent = ch === " " ? "\u00A0" : ch;
        container.appendChild(span);
      });
    }
    initWaveSignature();

    /**************************************************************
     * 3. HIỆU ỨNG TIÊU ĐỀ TỎA SÁNG MẮT CÁ (FISHEYE SHINE LOOP)
     **************************************************************/
    function renderFisheyeTitle(userName) {
      const fullTitle = `CHÚC ${userName.toUpperCase()} 20/10 VUI VẺ`;
      const heading = document.getElementById("fisheyeHeading");
      heading.innerHTML = "";

      let charCounter = 0;
      const words = fullTitle.split(" ");
      words.forEach((word) => {
        const wordSpan = document.createElement("span");
        wordSpan.className = "fisheye-word";
        [...word].forEach((ch) => {
          const charSpan = document.createElement("span");
          charSpan.className = "fisheye-char";
          charSpan.style.setProperty("--char-idx", charCounter++);
          charSpan.textContent = ch;
          wordSpan.appendChild(charSpan);
        });
        heading.appendChild(wordSpan);
      });
    }

    /**************************************************************
     * 4. HIỆU ỨNG GÕ CHỮ (TYPEWRITER)
     **************************************************************/
    let typingInterval = null;
    let currentFullMessage = "";

    function startTypewriter(text) {
      if (typingInterval) clearInterval(typingInterval);
      currentFullMessage = text;
      const output = document.getElementById("typewriterText");
      const cursor = document.getElementById("typingCursor");
      output.textContent = "";
      cursor.style.display = "inline-block";

      let idx = 0;
      typingInterval = setInterval(() => {
        if (idx < currentFullMessage.length) {
          output.textContent += currentFullMessage.charAt(idx);
          idx++;
        } else {
          clearInterval(typingInterval);
          typingInterval = null;
        }
      }, 22);
    }

    document.getElementById("btnSkipTyping").addEventListener("click", () => {
      if (typingInterval) {
        clearInterval(typingInterval);
        typingInterval = null;
      }
      document.getElementById("typewriterText").textContent = currentFullMessage;
    });

    /**************************************************************
     * 5. TRÌNH PHÁT NHẠC YOUTUBE TỰ ĐỘNG (LẶP ĐOẠN 120 GIÂY)
     **************************************************************/
    let ytPlayer = null;
    let ytApiReady = false;
    let pendingVideoId = null;
    let isPlaying = false;
    let timerInterval = null;

    function formatMMSS(totalSeconds) {
      const clamped = Math.max(0, Math.min(totalSeconds, MAX_DURATION_SECONDS));
      const mins = String(Math.floor(clamped / 60)).padStart(2, "0");
      const secs = String(clamped % 60).padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function onYouTubeIframeAPIReady() {
      ytApiReady = true;
      ytPlayer = new YT.Player("ytPlayerContainer", {
        height: "135",
        width: "240",
        videoId: "5h46b1Lm8DU",
        playerVars: {
          autoplay: 0,
          controls: 1,
          rel: 0,
          playsinline: 1,
          origin: window.location.origin
        },
        events: {
          onReady: () => {
            if (pendingVideoId) {
              playYouTube120s(pendingVideoId);
              pendingVideoId = null;
            }
          },
          onStateChange: (event) => {
            const disc = document.getElementById("musicDisc");
            const btn = document.getElementById("btnPlayPause");
            if (event.data === YT.PlayerState.PLAYING) {
              isPlaying = true;
              disc.classList.remove("paused");
              btn.textContent = "Tạm dừng";
            } else if (event.data === YT.PlayerState.ENDED) {
              // Tự động lặp lại đoạn 120s
              ytPlayer.seekTo(0, true);
              ytPlayer.playVideo();
            } else if (event.data === YT.PlayerState.PAUSED) {
              isPlaying = false;
              disc.classList.add("paused");
              btn.textContent = "Phát tiếp";
            }
          }
        }
      });
    }

    function playYouTube120s(videoId) {
      document.getElementById("musicBar").classList.add("show");

      if (ytApiReady && ytPlayer && typeof ytPlayer.loadVideoById === "function") {
        ytPlayer.unMute();
        ytPlayer.setVolume(100);
        ytPlayer.loadVideoById({
          videoId: videoId,
          startSeconds: 0,
          endSeconds: MAX_DURATION_SECONDS
        });
        ytPlayer.playVideo();
      } else {
        // Dự phòng trường hợp người dùng bấm ngay khi API đang tải
        pendingVideoId = videoId;
        const container = document.getElementById("ytHiddenWrap");
        container.innerHTML = `<iframe width="240" height="135" src="https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}&end=${MAX_DURATION_SECONDS}&playsinline=1" allow="autoplay; encrypted-media" frameborder="0"></iframe>`;
      }

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (ytPlayer && typeof ytPlayer.getCurrentTime === "function") {
          const cur = Math.floor(ytPlayer.getCurrentTime() || 0);
          if (cur >= MAX_DURATION_SECONDS) {
            ytPlayer.seekTo(0, true);
            ytPlayer.playVideo();
          }
          document.getElementById("musicTimer").textContent =
            `Đoạn nhạc 120s: ${formatMMSS(cur)} / 02:00`;
        }
      }, 500);
    }

    document.getElementById("btnPlayPause").addEventListener("click", () => {
      if (!ytPlayer || typeof ytPlayer.getPlayerState !== "function") return;
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.unMute();
        ytPlayer.playVideo();
      }
    });

    document.getElementById("btnToggleVideo").addEventListener("click", () => {
      document.getElementById("ytHiddenWrap").classList.toggle("visible-player");
    });

    /**************************************************************
     * 6. SỰ KIỆN CHUYỂN MÀN HÌNH KHI ẤN NÚT "BẮT ĐẦU"
     **************************************************************/
    let isGlowingMode = false;

    document.getElementById("btnStart").addEventListener("click", () => {
      const nameInput = document.getElementById("recipientName");
      const rawName = nameInput.value.trim();
      const errorEl = document.getElementById("errorText");

      if (!rawName) {
        errorEl.textContent = "⚠️ Bạn vui lòng nhập tên trước khi bắt đầu nhé!";
        nameInput.focus();
        return;
      }
      errorEl.textContent = "";

      const selectedRel = document.querySelector('input[name="relationship"]:checked').value;
      const data = WISH_CONFIG[selectedRel];

      // Chuyển sang chế độ hoa hồng phát sáng rơi xuống
      isGlowingMode = true;

      // Render tiêu đề mắt cá và bảng lời chúc gõ chữ
      renderFisheyeTitle(rawName);
      document.getElementById("recipientBadge").textContent = `🌹 Dành tặng ${data.label}: ${rawName}`;
      document.getElementById("musicTitle").textContent = data.songName;
      startTypewriter(data.message);

      // Chuyển màn hình
      document.getElementById("screenIntro").classList.remove("active");
      document.getElementById("screenWish").classList.add("active");

      // Phát nhạc YouTube 120s tương ứng
      playYouTube120s(data.youtubeId);
    });

    document.getElementById("btnBack").addEventListener("click", () => {
      isGlowingMode = false;
      document.getElementById("screenWish").classList.remove("active");
      document.getElementById("screenIntro").classList.add("active");
    });

    /**************************************************************
     * 7. ENGINE HOA HỒNG RƠI & PHÁT SÁNG (OFFSCREEN CANVAS 60FPS)
     **************************************************************/
    const canvas = document.getElementById("roseCanvas");
    const ctx = canvas.getContext("2d", { alpha: true });
    let cw = (canvas.width = window.innerWidth);
    let ch = (canvas.height = window.innerHeight);

    window.addEventListener("resize", () => {
      cw = canvas.width = window.innerWidth;
      ch = canvas.height = window.innerHeight;
    });

    // Tạo sẵn 2 Sprite Hoa Hồng (Thường & Phát Sáng) để vẽ 60FPS không giật lag
    function createRoseSprite(glowing) {
      const off = document.createElement("canvas");
      off.width = 72;
      off.height = 72;
      const octx = off.getContext("2d");
      octx.translate(36, 36);

      if (glowing) {
        const grad = octx.createRadialGradient(0, 0, 4, 0, 0, 34);
        grad.addColorStop(0, "rgba(255, 255, 255, 0.95)");
        grad.addColorStop(0.35, "rgba(255, 42, 133, 0.85)");
        grad.addColorStop(0.7, "rgba(255, 0, 127, 0.35)");
        grad.addColorStop(1, "rgba(255, 0, 127, 0)");
        octx.fillStyle = grad;
        octx.beginPath();
        octx.arc(0, 0, 34, 0, Math.PI * 2);
        octx.fill();
      }

      // Vẽ các cánh hoa hồng
      const petals = 6;
      for (let i = 0; i < petals; i++) {
        octx.save();
        octx.rotate((i * Math.PI * 2) / petals);
        octx.beginPath();
        octx.fillStyle = glowing ? "#ff4da6" : "#e6196b";
        octx.arc(0, -8, 9, 0, Math.PI * 2);
        octx.fill();
        octx.restore();
      }

      // Nhụy hoa hồng xoáy tâm
      octx.beginPath();
      octx.fillStyle = glowing ? "#ffffff" : "#ff99c2";
      octx.arc(0, 0, 6.5, 0, Math.PI * 2);
      octx.fill();

      return off;
    }

    const normalRoseSprite = createRoseSprite(false);
    const glowingRoseSprite = createRoseSprite(true);

    const ROSE_COUNT = window.innerWidth < 600 ? 32 : 52;
    const roses = Array.from({ length: ROSE_COUNT }, () => ({
      x: Math.random() * cw,
      y: Math.random() * ch,
      size: 20 + Math.random() * 24,
      speedY: 1.1 + Math.random() * 1.9,
      speedX: -0.6 + Math.random() * 1.2,
      swayAmp: 0.6 + Math.random() * 1.2,
      swaySpeed: 0.015 + Math.random() * 0.025,
      angle: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.03,
      phase: Math.random() * Math.PI * 2
    }));

    function animateRoses() {
      ctx.clearRect(0, 0, cw, ch);
      const sprite = isGlowingMode ? glowingRoseSprite : normalRoseSprite;

      for (let i = 0; i < roses.length; i++) {
        const r = roses[i];
        r.phase += r.swaySpeed;
        r.y += r.speedY * (isGlowingMode ? 1.25 : 1);
        r.x += r.speedX + Math.sin(r.phase) * r.swayAmp;
        r.angle += r.spin;

        if (r.y > ch + 40) {
          r.y = -40;
          r.x = Math.random() * cw;
        }
        if (r.x > cw + 40) r.x = -40;
        if (r.x < -40) r.x = cw + 40;

        ctx.save();
        ctx.translate(r.x, r.y);
        ctx.rotate(r.angle);
        ctx.drawImage(sprite, -r.size / 2, -r.size / 2, r.size, r.size);
        ctx.restore();
      }

      requestAnimationFrame(animateRoses);
    }

    animateRoses();
  </script>
